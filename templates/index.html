<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Document Q&amp;A Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="app-wrapper">

        <!-- ── Header ─────────────────────────────────────────── -->
        <header class="app-header">
            <div class="header-inner">
                <div class="header-logo">
                    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10 9 9 9 8 9"/>
                    </svg>
                    <span class="header-title">RAG Document Q&amp;A</span>
                </div>
                <p class="header-subtitle">Upload a PDF, then ask questions about its contents</p>
            </div>
        </header>

        <main class="app-main">

            <!-- ── Upload card ──────────────────────────────────── -->
            <section class="card" id="upload-section" aria-labelledby="upload-heading">
                <h2 class="card-title" id="upload-heading">
                    <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <polyline points="16 16 12 12 8 16"/>
                        <line x1="12" y1="12" x2="12" y2="21"/>
                        <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
                    </svg>
                    Upload Document
                </h2>

                <div class="upload-area" id="drop-zone" role="region" aria-label="File drop zone">
                    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="12" y1="18" x2="12" y2="12"/>
                        <polyline points="9 15 12 12 15 15"/>
                    </svg>
                    <p class="upload-primary">Drag &amp; drop a PDF here</p>
                    <p class="upload-secondary">or click to browse</p>
                    <input
                        type="file"
                        id="file-input"
                        accept=".pdf"
                        aria-label="Choose PDF file"
                        class="file-input-hidden"
                    >
                </div>

                <!-- File selected indicator -->
                <div class="file-selected" id="file-selected" aria-live="polite" hidden>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                    </svg>
                    <span id="selected-filename">No file selected</span>
                    <button class="btn-clear" id="clear-file" aria-label="Remove selected file" title="Remove file">×</button>
                </div>

                <button class="btn btn-primary" id="upload-btn" disabled aria-describedby="upload-status">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <polyline points="16 16 12 12 8 16"/>
                        <line x1="12" y1="12" x2="12" y2="21"/>
                        <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
                    </svg>
                    <span class="btn-label">Upload &amp; Process</span>
                    <span class="btn-spinner" aria-hidden="true" hidden></span>
                </button>

                <!-- Upload status message -->
                <div class="status-message" id="upload-status" role="status" aria-live="polite" hidden></div>
            </section>

            <!-- ── Uploaded documents list ──────────────────────── -->
            <section class="card" id="docs-section" hidden aria-labelledby="docs-heading">
                <h2 class="card-title" id="docs-heading">
                    <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M9 11l3 3L22 4"/>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                    </svg>
                    Indexed Documents
                </h2>
                <ul class="doc-list" id="doc-list" aria-label="Indexed documents"></ul>
            </section>

            <!-- ── Q&A card ─────────────────────────────────────── -->
            <section class="card" id="qa-section" aria-labelledby="qa-heading">
                <h2 class="card-title" id="qa-heading">
                    <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                        <line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                    Ask a Question
                </h2>

                <div class="qa-input-group">
                    <label for="question-input" class="visually-hidden">Your question</label>
                    <textarea
                        id="question-input"
                        class="question-textarea"
                        placeholder="Ask a question about your uploaded document…"
                        rows="3"
                        maxlength="1000"
                        aria-describedby="ask-status"
                    ></textarea>
                    <div class="qa-actions">
                        <span class="char-count" id="char-count" aria-live="polite">0 / 1000</span>
                        <button class="btn btn-primary" id="ask-btn" aria-describedby="ask-status">
                            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <line x1="22" y1="2" x2="11" y2="13"/>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                            </svg>
                            <span class="btn-label">Ask</span>
                            <span class="btn-spinner" aria-hidden="true" hidden></span>
                        </button>
                    </div>
                </div>

                <!-- Answer area (shown after first successful ask) -->
                <div class="answer-container" id="answer-container" hidden>

                    <!-- Loading skeleton -->
                    <div class="answer-loading" id="answer-loading" hidden aria-label="Generating answer" aria-live="polite">
                        <div class="skeleton skeleton-line wide"></div>
                        <div class="skeleton skeleton-line"></div>
                        <div class="skeleton skeleton-line medium"></div>
                    </div>

                    <!-- Answer result -->
                    <div class="answer-result" id="answer-result" hidden>
                        <div class="answer-label">Answer</div>
                        <p class="answer-text" id="answer-text"></p>

                        <!-- Sources -->
                        <div class="sources-block" id="sources-block" hidden>
                            <div class="sources-label">Sources</div>
                            <ul class="sources-list" id="sources-list" aria-label="Source references"></ul>
                        </div>
                    </div>

                    <!-- Error result -->
                    <div class="answer-error" id="answer-error" hidden role="alert"></div>

                </div>

                <!-- Ask status (for screen readers) -->
                <div class="status-message" id="ask-status" role="status" aria-live="polite" hidden></div>
            </section>

        </main>

        <footer class="app-footer">
            <p>Powered by <strong>Ollama</strong> · <strong>llama3.2</strong> · <strong>ChromaDB</strong> · <strong>HuggingFace</strong></p>
        </footer>

    </div><!-- /.app-wrapper -->

    <script src="/static/script.js"></script>
</body>
</html>
